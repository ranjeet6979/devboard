name: Kyverno Policy Validation

on:
    workflow_call:

jobs:
  kyverno:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v7

      - name: Install Kyverno CLI
        uses: kyverno/action-install-cli@v0.2.0
        with:
          release: 'v1.14.0'

      - name: Validate Kubernetes manifests
        run: |
          kyverno apply kyverno-policy/app-label.yml --resource k8s/

      - name: Enforce no-latest-tag policy on deployments
        run: |
          kyverno apply kyverno-policy/not-latest-image-tag.yml --resource k8s/