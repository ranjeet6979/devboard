name: Docker Push

on:
  workflow_call:
    inputs:
      image_tag:
        description: Immutable tag to push (e.g. sha-abc1234)
        required: true
        type: string

jobs:
  build-push:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        folders: ['backend', 'frontend', 'ai-service']

    permissions:
      contents: read
      id-token: write
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3.6.0
  
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.11.1

      - name: Docker Setup [Login]
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Hardened Images [Login]
        uses: docker/login-action@v4
        with:
          registry: dhi.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Generate SBOM
        uses: sbomify/sbomify-action@master
        env:
          LOCK_FILE: package-lock.json
          OUTPUT_FILE: sbom.cdx.json
          ENRICH: true
          UPLOAD: false

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json

      - name: Docker Build and Push
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.folders }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/devboard-${{ matrix.folders }}:${{ inputs.image_tag }}
            ${{ vars.DOCKERHUB_USERNAME }}/devboard-${{ matrix.folders }}:latest

      - name: Sign Image with Cosign
        env:
          IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/devboard-${{ matrix.folders }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
