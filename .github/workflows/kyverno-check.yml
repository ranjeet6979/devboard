name: Kyverno Policy Validation

on:
    workflow_call:

jobs:
  kyverno:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v7

      - name: Install Kyverno CLI
        uses: kyverno/action-install-cli@v1.1.1
        with:
          release: 'v1.14.0'

      - name: Validate manifests
        run: |
          kyverno apply kyverno-policy/ --resource k8s/
