name: Kyverno Policy Validation

on:
    workflow_call:

jobs:
  kyverno:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v7

      - name: Install Kyverno CLI
        uses: kyverno/action-install-cli@v0.2.0
        with:
          release: 'v1.14.0'

      - name: Validate deployment manifests
        run: |
          for file in k8s/*; do
            if grep -q "^kind: Deployment" "$file"; then
              kyverno apply kyverno-policy/app-label.yml --resource "$file"
            fi
          done

      - name: Enforce no-latest-tag policy on deployments
        run: |
          for file in k8s/*; do
            if grep -q "^kind: Deployment" "$file"; then
              kyverno apply kyverno-policy/not-latest-image-tag.yml --resource "$file"
            fi
          done